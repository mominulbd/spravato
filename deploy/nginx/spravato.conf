# Spravato — one domain, two apps (docs/DEVELOPMENT-PLAN.md §1, D2).
#
#   Laravel (PHP-FPM): /admin, /api/v1, /sanctum, /build, /storage, /up, /login
#   Next.js (node):    everything else, starting with / (incl. /robots.txt,
#                      /sitemap.xml, /indexnow-key.txt and /api/revalidate)
#
# Install (deploy/README.md, "First-time server setup"):
#   sudo cp deploy/nginx/spravato.conf /etc/nginx/sites-available/spravato
#   sudo ln -s ../sites-available/spravato /etc/nginx/sites-enabled/spravato
#   sudo nginx -t && sudo systemctl reload nginx
# Replace example.com (4 places). TLS paths assume certbot.
#
# Security headers (CSP, HSTS, frame options, …) are set by the apps
# themselves — app/Support security headers middleware for Laravel and the
# Next.js config for the site — so none are added here, to avoid duplicates.
# The only exception is the static /storage and /build files, which never
# reach either app.
#
# Client IP: nginx is the edge, so $remote_addr is the visitor. Laravel gets
# it as REMOTE_ADDR (PHP runs directly, no proxy hop); the site gets it as
# X-Real-IP / X-Forwarded-For, which are *overwritten* below (never appended),
# so a visitor cannot spoof the address the consultation form forwards to
# Laravel's rate limiter. Behind Cloudflare, also include
# deploy/nginx/cloudflare-realip.conf (see the http-level line below).

# The active Next.js instance (127.0.0.1:3000 or :3001). deploy/deploy.sh
# rewrites this file when it switches instances (blue/green), then reloads
# nginx; `deploy.sh setup` creates it. Defines `upstream spravato_site`.
include /var/www/spravato/shared/nginx/site-upstream.conf;

# Behind Cloudflare (or another CDN) only — restores the visitor address:
# include /etc/nginx/snippets/spravato-cloudflare-realip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot's HTTP-01 challenge (webroot mode); everything else → HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:spravato_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/spravato/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/spravato.access.log;
    error_log  /var/log/nginx/spravato.error.log warn;

    # Media uploads (packages/media/config): images and PDFs, plus headroom.
    client_max_body_size 25m;

    # Compression. Next.js already gzips its own responses (nginx then leaves
    # them alone); this covers PHP/JSON and the static files. Brotli needs the
    # ngx_brotli module (`apt install libnginx-mod-http-brotli-filter
    # libnginx-mod-http-brotli-static`); uncomment the brotli lines once it is
    # loaded — `nginx -t` fails on them otherwise.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/manifest+json
               image/svg+xml font/ttf font/otf;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types text/plain text/css text/xml application/json application/javascript
    #              application/xml application/rss+xml application/manifest+json
    #              image/svg+xml font/ttf font/otf;

    # ── Laravel ────────────────────────────────────────────────────────────
    # Exact /admin plus /admin/… (not /administrator), the API, Sanctum's
    # CSRF cookie, the health check and the /login → /admin/login redirect.
    location = /admin       { rewrite ^ /index.php last; }
    location ^~ /admin/     { rewrite ^ /index.php last; }
    location ^~ /api/v1/    { rewrite ^ /index.php last; }
    location ^~ /sanctum/   { rewrite ^ /index.php last; }
    location = /up          { rewrite ^ /index.php last; access_log off; }
    location = /login       { rewrite ^ /index.php last; }

    # The admin's Vite build: fingerprinted, cache forever.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media served from storage/app/public (php artisan storage:link): the
    # re-encoded images, their variants and the official PDFs. Static only:
    # `^~` keeps the PHP locations below from ever matching here, and
    # anything that is not a known media type is refused. Paths are
    # content-addressed (media/<uuid>/<rev>-<name>.<ext>; a replace writes a
    # new <rev>), so they are cached as immutable.
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;

        # Only what the media library writes (packages/media StoreUploadedFile).
        location ~* \.(?:jpe?g|png|webp|avif|pdf)$ {
            try_files $uri =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable";

            # PDFs open in the browser's viewer, not as a download, and save
            # under their readable name: media/<uuid>/<rev>-<name>.pdf →
            # "<name>.pdf". Typed here so a missing mime.types entry cannot
            # turn them into application/octet-stream.
            location ~* "^/storage/media/[^/]+/[a-z0-9]{6}-(?<pdf_name>[a-z0-9-]+\.pdf)$" {
                types { }
                default_type application/pdf;
                try_files $uri =404;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Content-Disposition "inline; filename=\"$pdf_name\"" always;
            }
        }

        location ~ ^ { return 404; }
    }

    # The only PHP entry point; reached through the rewrites above.
    location = /index.php {
        internal;
        # The pool in deploy/php-fpm/spravato.conf.
        fastcgi_pass unix:/run/php/php8.4-fpm-spravato.sock;
        include fastcgi_params;
        # After the include, so these win: the real release path, which
        # also keys OPcache per release (symlinked `current`).
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # nginx is the edge and talks to PHP directly, so no X-Forwarded-*
        # a client sends is ever true; drop them before Laravel's
        # TrustProxies (127.0.0.1) could read them.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file, dotfile or Laravel internals are ever served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    # ── Next.js ────────────────────────────────────────────────────────────
    # Hashed build assets, served from disk. deploy.sh copies every release's
    # .next/static into one shared directory (and prunes files no release has
    # used for 14 days), so a page rendered by the previous release still
    # finds its chunks right after a switch. Cache forever: names change with
    # content.
    location ^~ /_next/static/ {
        alias /var/www/spravato/shared/next-static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://spravato_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the site trusts the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Server Components stream; let chunks through as they render.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
