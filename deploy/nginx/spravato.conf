# Spravato — one domain, two apps (docs/DEVELOPMENT-PLAN.md §1, D2).
#
#   Laravel (PHP-FPM): /admin, /api/v1, /sanctum, /build, /storage, /up, /login
#   Next.js (node):    everything else, starting with /
#
# Replace example.com, the release path and the PHP-FPM socket. TLS lines
# assume certbot. Laravel's TRUSTED_PROXIES needs nothing extra here: nginx
# runs PHP directly, so Laravel sees the real host. Next.js runs as the
# systemd unit in deploy/systemd/spravato-site.service on 127.0.0.1:3000.

upstream spravato_site {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/spravato/current/public;
    index index.php;
    charset utf-8;

    # Media uploads (packages/media/config): images and PDFs.
    client_max_body_size 25m;

    # ── Laravel ────────────────────────────────────────────────────────────
    # Exact /admin plus /admin/… (not /administrator), the API, Sanctum's
    # CSRF cookie, the health check and the /login → /admin/login redirect.
    location = /admin       { rewrite ^ /index.php last; }
    location ^~ /admin/     { rewrite ^ /index.php last; }
    location ^~ /api/v1/    { rewrite ^ /index.php last; }
    location ^~ /sanctum/   { rewrite ^ /index.php last; }
    location = /up          { rewrite ^ /index.php last; }
    location = /login       { rewrite ^ /index.php last; }

    # The admin's Vite build: fingerprinted, cache forever.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media served from storage/app/public (php artisan storage:link).
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # The only PHP entry point; reached through the try_files above.
    location = /index.php {
        internal;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file, dotfile or Laravel internals are ever served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    # ── Next.js ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://spravato_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
