# Spravato — Apache variant of deploy/nginx/spravato.conf (the primary,
# tested config), for hosts that run Apache 2.4 with PHP-FPM. Same split:
#
#   Laravel: /admin, /api/v1, /sanctum, /build, /storage, /up, /login
#   Next.js: everything else (127.0.0.1:3000, deploy/systemd or deploy/pm2)
#
# Modules: ssl proxy proxy_http proxy_fcgi rewrite headers alias deflate
# (brotli optional): `sudo a2enmod ssl proxy proxy_http proxy_fcgi rewrite
# headers alias deflate brotli`.
#
# Unlike nginx, Apache cannot switch upstreams with a graceful reload as
# cheaply, so this variant pairs with SITE_MANAGER=pm2 (one port, 3000;
# `pm2 reload` replaces workers without dropping requests). Replace
# example.com (4 places). Shared hosting that cannot proxy part of a domain
# to a node process cannot run this layout (docs/DEVELOPMENT-PLAN.md §4).
#
# Security headers (CSP, HSTS, …) come from the apps themselves; only the
# static /build, /_next/static and /storage files get headers here.

<VirtualHost *:80>
    ServerName example.com
    # certbot's HTTP-01 challenge (webroot mode); everything else → HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    DocumentRoot /var/www/spravato/current/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Protocols h2 http/1.1

    ErrorLog  ${APACHE_LOG_DIR}/spravato.error.log
    CustomLog ${APACHE_LOG_DIR}/spravato.access.log combined

    # Media uploads: 25 MB, as in the nginx file.
    LimitRequestBody 26214400

    # Apache is the edge: no X-Forwarded-* a client sends is true. Dropped
    # before anything reads them; mod_proxy then adds X-Forwarded-For with
    # the visitor alone (the site trusts its first entry), and PHP never sees
    # one. Behind Cloudflare, use mod_remoteip instead (deploy/README.md).
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader unset X-Forwarded-Port early
    RequestHeader unset X-Real-IP early
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    <Directory /var/www/spravato/current/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # The only PHP entry point (the pool in deploy/php-fpm/spravato.conf).
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-spravato.sock|fcgi://localhost"
    </FilesMatch>
    <FilesMatch "(?<!^index)\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>

    # Compression: Next.js gzips its own responses; this covers the rest.
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml
    </IfModule>
    <IfModule !mod_brotli.c>
        AddOutputFilterByType DEFLATE text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml
    </IfModule>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # Laravel's paths are served from public/ (its .htaccess routes them to
    # index.php); `!` keeps them away from the Next.js proxy below. Exact
    # matches for /up and /login, so /upcoming or /login-help stay the site's.
    ProxyPassMatch "^/admin(/.*)?$" "!"
    ProxyPass /api/v1/  "!"
    ProxyPass /sanctum/ "!"
    ProxyPass /build/   "!"
    ProxyPass /storage/ "!"
    ProxyPassMatch "^/up$"    "!"
    ProxyPassMatch "^/login$" "!"
    ProxyPass /.well-known/acme-challenge/ "!"
    # Laravel's .htaccess rewrites its paths to /index.php, which is then
    # matched again here: keep it local, or every Laravel path reaches node.
    ProxyPassMatch "^/index\.php$" "!"

    # The site's hashed assets, from disk (deploy.sh keeps every release's
    # copy in shared/next-static).
    ProxyPass /_next/static/ "!"
    Alias /_next/static/ /var/www/spravato/shared/next-static/
    <Directory /var/www/spravato/shared/next-static>
        AllowOverride None
        Options -Indexes
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Everything else is the Next.js site. flushpackets lets streamed Server
    # Component output through as it renders.
    ProxyPass        / http://127.0.0.1:3000/ keepalive=On flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3000/

    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Media from storage/app/public (php artisan storage:link): images,
    # their variants and the official PDFs. Static only. PHP runs solely for
    # public/index.php (FilesMatch above), .htaccess files are ignored here
    # (both the link and its target), and anything that is not a media type
    # the library writes is refused. Paths are content-addressed
    # (media/<uuid>/<rev>-<name>.<ext>; a replace writes a new <rev>), so
    # they are cached as immutable.
    <Directory /var/www/spravato/current/public/storage>
        AllowOverride None
        Options -Indexes -ExecCGI -Includes
        RemoveHandler .php .phtml .phar
    </Directory>
    <Directory /var/www/spravato/shared/storage/app/public>
        AllowOverride None
        Options -Indexes -ExecCGI -Includes
        RemoveHandler .php .phtml .phar
    </Directory>
    <LocationMatch "^/storage/">
        Header always set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/storage/(?!.*\.(?i:jpe?g|png|webp|avif|pdf)$)">
        Require all denied
    </LocationMatch>
    # PDFs open in the browser's viewer and save under their readable name:
    # media/<uuid>/<rev>-<name>.pdf → "<name>.pdf".
    <LocationMatch "^/storage/media/[^/]+/[a-z0-9]{6}-(?<pdfname>[a-z0-9-]+\.pdf)$">
        ForceType application/pdf
        Header set Content-Disposition "inline; filename=\"%{MATCH_PDFNAME}e\""
    </LocationMatch>
</VirtualHost>
