# Spravato — Apache variant of deploy/nginx/spravato.conf, for hosts that
# run Apache with PHP-FPM. Needs mod_proxy, mod_proxy_http, mod_proxy_fcgi,
# mod_rewrite and mod_headers. Same split as the nginx file:
#
#   Laravel: /admin, /api/v1, /sanctum, /build, /storage, /up, /login
#   Next.js: everything else (systemd unit on 127.0.0.1:3000)
#
# Shared hosting that cannot proxy to a node process cannot run this layout;
# see "Hosting" in docs/DEVELOPMENT-PLAN.md §4.

<VirtualHost *:443>
    ServerName example.com
    DocumentRoot /var/www/spravato/current/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    LimitRequestBody 26214400

    <Directory /var/www/spravato/current/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # Laravel's paths are served from public/ (its .htaccess routes them to
    # index.php); `!` keeps them away from the Next.js proxy below.
    ProxyPassMatch "^/admin(/.*)?$" "!"
    ProxyPass /api/v1/  "!"
    ProxyPass /sanctum/ "!"
    ProxyPass /build/   "!"
    ProxyPass /storage/ "!"
    ProxyPass /up       "!"
    ProxyPass /login    "!"

    # Everything else is the Next.js site.
    ProxyPass        / http://127.0.0.1:3000/ keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>

<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>
