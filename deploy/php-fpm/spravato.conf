; Spravato — PHP-FPM pool. Runs Laravel as the `spravato` user (the same
; user that owns /var/www/spravato, runs the queue worker, the scheduler and
; the Next.js site), so storage/ never needs world-writable permissions.
;
; Install: sudo cp deploy/php-fpm/spravato.conf /etc/php/8.4/fpm/pool.d/spravato.conf
;          sudo php-fpm8.4 -t && sudo systemctl reload php8.4-fpm
; The nginx/Apache configs talk to the socket below.

[spravato]
user = spravato
group = spravato

listen = /run/php/php8.4-fpm-spravato.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A small clinic site: a handful of workers is plenty. Raise max_children
; if `pm.max_children reached` shows up in /var/log/php8.4-fpm.log.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

; Health of the pool itself, reachable only through a local nginx location
; if one is ever added; not exposed by deploy/nginx/spravato.conf.
pm.status_path = /fpm-status

request_terminate_timeout = 65s
catch_workers_output = yes
decorate_workers_output = no

; Media uploads (deploy/nginx client_max_body_size 25m).
php_admin_value[upload_max_filesize] = 24M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/spravato/shared/storage/logs/php-fpm.log

; OPcache: releases are immutable, so timestamps are never checked; every
; deploy reloads PHP-FPM (deploy.sh), which empties the cache. nginx passes
; $realpath_root, so each release is cached under its own real path.
php_admin_flag[opcache.enable] = on
php_admin_flag[opcache.validate_timestamps] = off
php_admin_value[realpath_cache_ttl] = 600
; opcache.memory_consumption / max_accelerated_files are server-wide:
; set them in /etc/php/8.4/fpm/conf.d/10-opcache.ini if ever needed.
