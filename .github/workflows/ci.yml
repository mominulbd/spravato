name: CI

# Phase 4 launch gate (docs/LAUNCH-CHECKLIST.md): every job must be green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: spravato-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only key: CI databases are thrown away after every run. No .env is written.
  APP_KEY: base64:c3ByYXZhdG8tY2ktb25seS10ZXN0LWtleS0wMDAwMDA=
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, gd, exif, bcmath, fileinfo, sodium

jobs:
  # Pint + PHPStan level 8 + Pest on MySQL (spravato_test).
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spravato_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: php artisan test --compact

  # React admin (resources/js): ESLint, tsc, Vitest, Vite build.
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm test
      - run: npm run build

  # The Next.js public site (site/), served on the same domain as Laravel.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site run types
      - run: npm --prefix site test
      # No `next build` here: prerendering / reads the page from the Laravel
      # API. The e2e job builds the site for production against a live API.

  # Playwright against real servers (playwright.config.ts starts Laravel on
  # spravato_e2e and a production build of the site), including the axe
  # accessibility pass (tests/e2e/a11y.spec.ts). Uses Google Chrome (channel: chrome).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spravato_e2e
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      E2E_APP_KEY: base64:c3ByYXZhdG8tY2ktb25seS10ZXN0LWtleS0wMDAwMDA=
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm --prefix site ci
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: Playwright (builds the admin first)
        run: npm run build && npx playwright test --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
