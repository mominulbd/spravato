name: CI

# Phase 4 launch gate (docs/LAUNCH-CHECKLIST.md): every job must be green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reset_database:
        description: "DESTRUCTIVE: drop every table on the host and re-migrate. First-deploy recovery only — refused once consultation requests or users exist."
        type: boolean
        default: false

# Superseded PR runs are worth cancelling; a run on main is not, because the
# deploy job below would be interrupted between `rsync --delete` and
# `migrate --force`, leaving the host on new code against an old schema.
concurrency:
  group: spravato-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Test-only key: CI databases are thrown away after every run. No .env is written.
  APP_KEY: base64:c3ByYXZhdG8tY2ktb25seS10ZXN0LWtleS0wMDAwMDA=
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, gd, exif, bcmath, fileinfo, sodium

jobs:
  # Pint + PHPStan level 8 + Pest on MySQL (spravato_test).
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spravato_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: php artisan test --compact

  # React admin (resources/js): ESLint, tsc, Vitest, Vite build.
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm test
      - run: npm run build

  # The Next.js public site (site/), served on the same domain as Laravel.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site run types
      - run: npm --prefix site test
      # No `next build` here: prerendering / reads the page from the Laravel
      # API. The e2e job builds the site for production against a live API.

  # Playwright against real servers (playwright.config.ts starts Laravel on
  # spravato_e2e and a production build of the site), including the axe
  # accessibility pass (tests/e2e/a11y.spec.ts). Uses Google Chrome (channel: chrome).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spravato_e2e
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      E2E_APP_KEY: base64:c3ByYXZhdG8tY2ktb25seS10ZXN0LWtleS0wMDAwMDA=
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm --prefix site ci
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: Playwright (builds the admin first)
        run: npm run build && npx playwright test --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Laravel (API + admin) to Hostinger over SSH, the uptms-ad layout. Gated on
  # the three test jobs, so a red build never reaches the host. The Next.js
  # site (site/) is NOT shipped here: Hostinger shared/Cloud hosting cannot
  # proxy part of one domain to a node process, so the site runs on its own
  # Node host and reads this API (deploy/README.md "Hostinger").
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [php, admin, site]
    # workflow_dispatch as well as push, or the reset_database input has no
    # job to reach. Still main-only, so a dispatch from a branch cannot deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}, xml, zip, curl
          tools: composer:v2
          coverage: none

      # Built here rather than on the shared host: the release has to carry a
      # vendor/ tree, because the rsync below runs --delete and would
      # otherwise wipe the server's.
      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # public/build is gitignored; the admin SPA ships only from here.
      - name: Build admin assets
        run: npm run build

      # Hostinger's panel presents SSH access as a whole command --
      # `ssh -p 65002 u123456789@82.180.132.207` -- so that string, or a bare
      # `user@host`, is what usually ends up in HOSTINGER_SSH_HOST. Normalise
      # once here and export the parts every later step uses.
      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e

          [ -n "$SSH_HOST" ] || { echo "HOSTINGER_SSH_HOST missing"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "HOSTINGER_SSH_KEY missing"; exit 1; }

          host=$(printf '%s' "$SSH_HOST" | tr -d '\r' | xargs)
          user=$(printf '%s' "$SSH_USER" | tr -d '\r' | xargs)
          port=$(printf '%s' "$SSH_PORT" | tr -d '\r' | xargs)

          # `ssh [-p PORT] [user@]host` pasted whole: take the port if it
          # carries one and no port secret was set, then the last word.
          case "$host" in
            ssh\ *|ssh://*)
              echo "HOSTINGER_SSH_HOST looks like a connection command or URL; parsing it."
              embedded_port=$(printf '%s' "$host" | sed -n 's/.*-p[[:space:]]*\([0-9][0-9]*\).*/\1/p')
              [ -n "$embedded_port" ] && [ -z "$port" ] && port="$embedded_port"
              host=${host##* }
              host=${host#ssh://}
              ;;
          esac

          # `user@host` in the host secret: the user half wins only when
          # HOSTINGER_SSH_USER was not set, so an explicit secret still rules.
          case "$host" in
            *@*)
              [ -n "$user" ] || user=${host%@*}
              host=${host#*@}
              ;;
          esac

          # A trailing `:port` (the URL form), same precedence rule.
          case "$host" in
            *:[0-9]*)
              [ -n "$port" ] || port=${host##*:}
              host=${host%:*}
              ;;
          esac

          host=${host%/}
          port=${port:-65002}

          [ -n "$user" ] || { echo "HOSTINGER_SSH_USER missing, and HOSTINGER_SSH_HOST carries no user@ to fall back on"; exit 1; }

          # The parsed values are no longer byte-identical to the secrets, so
          # nothing masks them any more. Register them before they reach a log.
          echo "::add-mask::$host"
          echo "::add-mask::$user"

          # Only a name needs resolving, and even then this is advisory:
          # `getent hosts <ip>` is a *reverse* lookup, so a Hostinger IP with
          # no PTR record fails it although ssh connects to it fine. The login
          # step below resolves the host itself and reports a genuinely bad
          # value better than a pre-flight guess can.
          case "$host" in
            *[!0-9.]*)
              if ! getent hosts "$host" >/dev/null 2>&1; then
                echo "Warning: HOSTINGER_SSH_HOST did not resolve from the runner."
                echo "If the login below fails, set it to the hostname or IP alone,"
                echo "with the username in HOSTINGER_SSH_USER and the port in"
                echo "HOSTINGER_SSH_PORT."
              fi
              ;;
          esac

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Best-effort and never fatal: every ssh and rsync below passes
          # StrictHostKeyChecking=no, and ssh-keyscan's exit status varies by
          # OpenSSH build.
          if ! ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts; then
            echo "ssh-keyscan could not fetch a host key; continuing."
          fi

          {
            echo "DEPLOY_SSH_HOST=$host"
            echo "DEPLOY_SSH_USER=$user"
            echo "DEPLOY_SSH_PORT=$port"
          } >> "$GITHUB_ENV"

          echo "SSH target resolved; port $port."

      - name: Verify SSH login
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p "$DEPLOY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "echo 'SSH connection successful'"

      # --delete removes anything on the host the checkout does not carry, so
      # every path that lives only on the server must be named here.
      #
      # --exclude both skips sending a path and spares it from --delete: .env
      # holds the credentials (APP_KEY decrypts every consultation request --
      # losing it loses the health records), storage/ holds uploaded media,
      # sessions and logs, and public/storage is the symlink into it.
      #
      # --filter='protect ...' spares a path from deletion while still letting
      # the repo's own copy through. That matters for .htaccess: the host's
      # document-root .htaccess must survive, while public/.htaccess (Laravel's
      # front controller rewrite) is tracked here and must keep shipping.
      # .well-known holds ACME challenge files during certificate renewal.
      - name: Deploy files
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -e

          [ -n "$DEPLOY_PATH" ] || { echo "HOSTINGER_DEPLOY_PATH missing"; exit 1; }

          rsync -az --delete --stats \
            -e "ssh -i ~/.ssh/id_rsa -p $DEPLOY_SSH_PORT -o StrictHostKeyChecking=no" \
            --filter='protect .htaccess' \
            --filter='protect .well-known/***' \
            --filter='protect .user.ini' \
            --filter='protect .env.backup-*' \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="/site" \
            --exclude="/docs" \
            --exclude="/tests" \
            --exclude=".phpunit.cache" \
            --exclude="packages/*/tests" \
            --exclude="test-results" \
            --exclude="playwright-report" \
            --exclude="public/hot" \
            --exclude=".env" \
            --exclude="storage/" \
            --exclude="public/storage" \
            ./ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_PATH"

      # Hostinger's default CLI `php` is often older than the ^8.3 composer.json
      # requires, and the newer builds sit alongside it rather than replacing
      # it. Resolve one instead of trusting PATH; set the repository variable
      # HOSTINGER_PHP_BIN if the plan keeps it somewhere this list misses.
      #
      # This selects the CLI only. The PHP the *website* runs under is set
      # per-domain in hPanel and has to be 8.3+ as well (8.4 recommended), or
      # the deploy succeeds and every request 500s.
      - name: Migrate and refresh caches
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH || vars.HOSTINGER_PUBLIC_PATH }}
          PHP_BIN_OVERRIDE: ${{ vars.HOSTINGER_PHP_BIN }}
          RESET_DATABASE: ${{ inputs.reset_database }}
        run: |
          set -e

          ssh -i ~/.ssh/id_rsa -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$PHP_BIN_OVERRIDE" "$RESET_DATABASE" "$PUBLIC_PATH" <<'REMOTE'
          set -e

          deploy_path=$1
          php_override=$2
          reset_database=$3
          public_path=$4

          [ -n "$deploy_path" ] || { echo "HOSTINGER_DEPLOY_PATH missing"; exit 1; }
          cd "$deploy_path"

          # storage/ is excluded from the rsync, so a fresh host has none of
          # Laravel's writable directories. view:clear and view:cache fail with
          # "View path not found" without storage/framework/views, and the
          # file cache and sessions need theirs. Existing files are untouched.
          mkdir -p storage/app/public storage/app/private \
            storage/framework/cache/data storage/framework/sessions \
            storage/framework/views storage/logs bootstrap/cache

          # Traversal bits before anything writes: the web server follows
          # public/storage into storage/app/public, so every directory on that
          # path has to be world-traversable. This must precede the seeders
          # below -- they upload the designed photography through the real
          # pipeline, and a 0700 directory there 404s the images afterwards.
          chmod 755 storage storage/app storage/app/public

          # When the project root IS the document root, its .htaccess is the
          # only thing keeping .env, vendor/ and storage/ from being served.
          # Restore it when absent; never overwrite an existing one. Skipped in
          # the split layout, where this directory is not web-served at all.
          if [ -n "$public_path" ]; then
            echo "Split layout (HOSTINGER_PUBLIC_PATH is set): this directory is not web-served."
          elif [ ! -f .htaccess ] && [ -f deploy/hostinger/document-root.htaccess ]; then
            cp deploy/hostinger/document-root.htaccess .htaccess
            echo "Document-root .htaccess was missing; restored it from deploy/hostinger/document-root.htaccess."
          fi

          php_bin=""
          for candidate in "$php_override" \
            /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php \
            /usr/bin/php8.4 /usr/bin/php8.3 \
            /usr/local/bin/php8.4 /usr/local/bin/php8.3 \
            php8.4 php8.3 php; do
              [ -n "$candidate" ] || continue
              command -v "$candidate" >/dev/null 2>&1 || continue
              version_id=$("$candidate" -r 'echo PHP_VERSION_ID;' 2>/dev/null) || continue
              case "$version_id" in ''|*[!0-9]*) continue ;; esac
              [ "$version_id" -ge 80300 ] || continue
              php_bin=$candidate
              break
          done

          if [ -z "$php_bin" ]; then
            echo "No PHP 8.3 or newer found on the host."
            echo "Default CLI is: $(php -v 2>/dev/null | head -1)"
            echo "Set the repository variable HOSTINGER_PHP_BIN to the full path of an"
            echo "8.3+ binary (Hostinger usually keeps them under /opt/alt/phpXX/usr/bin/php)."
            exit 1
          fi

          echo "Running artisan under $php_bin ($("$php_bin" -r 'echo PHP_VERSION;'))"

          [ -f .env ] || {
            echo "No .env on the host. The deploy never uploads one -- it holds the"
            echo "credentials and the APP_KEY that encrypts consultation requests."
            echo "Create it by hand; deploy/README.md "Hostinger" has the key set."
            exit 1
          }

          env_value() {
            sed -n "s/^[[:space:]]*$1=//p" .env | tail -1 | tr -d '"'"'"' ' | tr -d '\r'
          }

          # Reported rather than corrected: only the host knows its domains.
          app_env=$(env_value APP_ENV)
          if [ "$app_env" = "production" ]; then
            [ "$(env_value APP_DEBUG)" = "false" ] || echo "WARNING: APP_DEBUG is not false in production -- stack traces would reach visitors."
            [ -n "$(env_value APP_KEY)" ] || { echo "APP_KEY is empty. Set it once (php artisan key:generate) and never change it: it decrypts every consultation request."; exit 1; }
            case "$(env_value FRONTEND_URL)" in
              ''|*localhost*|*127.0.0.1*)
                echo "WARNING: FRONTEND_URL is unset or localhost. Revalidation and preview links will point at the wrong site."
                ;;
            esac
            [ -n "$(env_value FRONTEND_SITE_TOKEN)" ] || echo "WARNING: FRONTEND_SITE_TOKEN is empty; the site cannot vouch for visitor IPs (rate limits) or report 404s."
            [ -n "$(env_value FRONTEND_REVALIDATE_SECRET)" ] || echo "WARNING: FRONTEND_REVALIDATE_SECRET is empty; published changes will not refresh the site."
            case "$(env_value APP_URL)" in
              ''|*localhost*|*127.0.0.1*)
                echo "WARNING: APP_URL is unset or localhost. Media and PDF links are built from it and would point nowhere."
                ;;
            esac
            [ "$(env_value MAIL_MAILER)" != "log" ] || echo "WARNING: MAIL_MAILER=log writes staff alerts into laravel.log. Configure SMTP."
          else
            echo "WARNING: APP_ENV is '${app_env:-unset}', not production."
          fi

          # migrate:fresh only on an explicit manual dispatch with the box
          # ticked -- never on a push -- and refused while the database holds
          # anything real. "Could not check" must never read as "empty".
          if [ "$reset_database" = "true" ]; then
            live_rows=$("$php_bin" artisan tinker --execute='$n = 0; foreach (["consultation_requests", "users"] as $t) { if (Illuminate\Support\Facades\Schema::hasTable($t)) { $n += Illuminate\Support\Facades\DB::table($t)->count(); } } echo "LIVE_ROWS=".$n;' 2>/dev/null | grep -o 'LIVE_ROWS=[0-9]*' | cut -d= -f2)
            if [ "$live_rows" != "0" ]; then
              echo "Refusing reset_database: the database holds ${live_rows:-an unknown number of} consultation request/user rows."
              echo "migrate:fresh would delete them all. Back up and reset by hand if you really mean it."
              exit 1
            fi
            echo "reset_database was requested on an empty database: dropping every table and re-migrating."
            "$php_bin" artisan migrate:fresh --force
          else
            "$php_bin" artisan migrate --force
          fi

          # Roles and permissions on every deploy: PermissionSeeder is
          # idempotent, adds permissions new modules register, and never
          # touches grants an admin gave a role (Super Admin always holds all).
          "$php_bin" artisan db:seed --class='Uptms\Permissions\Seeders\PermissionSeeder' --force

          # The designed website content only on a fresh install. Its seeders
          # fill empty tables and never overwrite edits, but once the site is
          # live an admin emptying a collection on purpose must not see it
          # refilled by the next deploy.
          page_count=$("$php_bin" artisan tinker --execute='echo "PAGES=".Illuminate\Support\Facades\DB::table("pages")->count();' 2>/dev/null | grep -o 'PAGES=[0-9]*' | cut -d= -f2)
          if [ "$page_count" = "0" ]; then
            echo "No pages yet: seeding the designed site content."
            "$php_bin" artisan db:seed --force
          fi

          "$php_bin" artisan storage:link || true

          # The seeders and any upload create media/{uuid} directories under
          # a umask this host chooses, so repair the whole tree rather than
          # only its root: one 0700 directory in the path and the web server
          # cannot reach the file, which 404s that image and nothing else.
          find storage/app/public -type d ! -perm -755 -exec chmod 755 {} + || true

          # Clear before re-caching: a stale route or view cache from the
          # previous release is not overwritten by anything below.
          "$php_bin" artisan optimize:clear || {
            echo "optimize:clear failed (usually an unreachable cache store); clearing compiled files individually."
            "$php_bin" artisan config:clear
            "$php_bin" artisan route:clear
            "$php_bin" artisan view:clear
            "$php_bin" artisan event:clear || true
          }

          "$php_bin" artisan config:cache
          "$php_bin" artisan route:cache
          "$php_bin" artisan view:cache
          "$php_bin" artisan event:cache

          # Workers started by cron (`queue:work --stop-when-empty`) pick up
          # the new code on their next start; a long-running one is told to
          # finish its job and exit.
          "$php_bin" artisan queue:restart

          if ! "$php_bin" artisan tinker --execute='echo "ADMINS=".Illuminate\Support\Facades\DB::table("users")->count();' 2>/dev/null | grep -q 'ADMINS=[1-9]'; then
            echo
            echo "No users yet. Create the first Super Admin over SSH (it asks for the password):"
            echo "  cd $deploy_path && $php_bin artisan uptms:create-super-admin you@clinic.com \"Your Name\""
          fi
          REMOTE

      # Publishes ONLY the contents of public/ into the directory Apache
      # serves, so .env, vendor/, app/ and storage/ live outside the web root:
      #
      #   ~/domains/<domain>/laravel/       <- HOSTINGER_DEPLOY_PATH, never served
      #   ~/domains/<domain>/public_html/   <- HOSTINGER_PUBLIC_PATH, document root
      #
      # Opt-in: with HOSTINGER_PUBLIC_PATH unset this step skips, for hosts
      # where the document root already points at .../public.
      #
      # rsync runs ON the host, between two local directories, and after the
      # migrate step on purpose: that step refuses without a .env, so a wrong
      # DEPLOY_PATH never reaches the --delete below.
      - name: Publish Laravel public directory
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH || vars.HOSTINGER_PUBLIC_PATH }}
        run: |
          set -e

          if [ -z "$PUBLIC_PATH" ]; then
            echo "HOSTINGER_PUBLIC_PATH is not set, so the Laravel tree is assumed to be served"
            echo "directly (document root at .../public, or the document-root .htaccess)."
            echo "Nothing to publish. See deploy/README.md "Hostinger"."
            exit 0
          fi

          ssh -i ~/.ssh/id_rsa -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$PUBLIC_PATH" <<'REMOTE'
          set -e

          deploy_path=${1%/}
          public_path=${2%/}

          [ -n "$deploy_path" ] || { echo "HOSTINGER_DEPLOY_PATH missing"; exit 1; }
          [ -d "$deploy_path/public" ] || {
            echo "$deploy_path/public does not exist, so HOSTINGER_DEPLOY_PATH is not the"
            echo "Laravel project root (the directory holding artisan and .env)."
            exit 1
          }
          [ -d "$public_path" ] || {
            echo "$public_path does not exist. Create the document root first, or correct"
            echo "HOSTINGER_PUBLIC_PATH -- this step will not create a web root it was pointed at by mistake."
            exit 1
          }

          # Resolve both before comparing: a public_html symlinked at public/
          # is the same directory, and rsync --delete into itself deletes as
          # it goes.
          app_root=$(cd "$deploy_path" && pwd -P)
          src=$(cd "$deploy_path/public" && pwd -P)
          dest=$(cd "$public_path" && pwd -P)

          if [ "$src" = "$dest" ]; then
            echo "$public_path already IS $deploy_path/public; nothing to copy."
            exit 0
          fi

          # Refuse the targets where --delete is catastrophic: the filesystem
          # root, the home directory, and any directory containing the
          # application itself.
          case "$dest" in
            /|"$HOME") echo "Refusing to --delete inside $dest."; exit 1 ;;
          esac
          case "$app_root/" in
            "$dest"/*)
              echo "$app_root sits inside $dest, so publishing there with --delete would erase"
              echo "the application. Move the Laravel tree out of the web root first."
              exit 1
              ;;
          esac

          if [ -f "$dest/.env" ]; then
            backup="$app_root/.env.webroot-$(date +%Y%m%d%H%M%S)"
            cp "$dest/.env" "$backup"
            echo "WARNING: found $dest/.env inside the web root -- treat every credential in it as"
            echo "compromised and rotate it. Copied to $backup; the sync below removes it."
          fi

          # The web root reaches the media disk only through storage/, and a
          # real directory left there by an earlier layout shadows it: the web
          # server serves that tree instead and every media URL 404s while the
          # files sit untouched on the disk. Settled before the rsync below,
          # whose --delete would otherwise clear such a directory to make way
          # for the symlink. Nothing here removes a directory with files in it.
          want="$app_root/storage/app/public"

          if [ -L "$dest/storage" ]; then
            if [ "$(readlink "$dest/storage")" != "$want" ]; then
              rm "$dest/storage"
              ln -s "$want" "$dest/storage"
              echo "Repointed $dest/storage -> $want."
            fi
          elif [ ! -e "$dest/storage" ]; then
            ln -s "$want" "$dest/storage"
            echo "Created $dest/storage -> $want."
          elif [ -d "$dest/storage" ] && [ -z "$(ls -A "$dest/storage")" ]; then
            rmdir "$dest/storage"
            ln -s "$want" "$dest/storage"
            echo "Replaced an empty $dest/storage directory with the symlink."
          else
            echo "$dest/storage is a real directory holding files, shadowing the media disk"
            echo "at $want -- every media URL 404s while it is there. Move anything it holds"
            echo "into that directory, delete it, then re-run this workflow."
            exit 1
          fi

          # .htaccess is excluded (neither sent nor deleted): the served one is
          # usually the host's, with an hPanel PHP handler block. Handled below.
          rsync -a --delete \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            "$src/" "$dest/"

          echo "Published $src/ -> $dest/"

          if [ ! -d "$dest/storage/." ]; then
            echo "$dest/storage does not resolve to a directory, so every media URL will 404."
            echo "Expected it to reach $want."
            exit 1
          fi

          # public/index.php loads the framework from __DIR__.'/../'. Copied
          # into a web root elsewhere, `..` is no longer the app, so every
          # dynamic request would fatal. Rewrite the published copy (never the
          # repo's) to the absolute app root; rsync re-copies a pristine one
          # every deploy, so this never compounds.
          case "$app_root" in
            *[\|\\\&]*) echo "Refusing to rewrite index.php: $app_root contains a character that would break the substitution."; exit 1 ;;
          esac

          sed "s|__DIR__\.'/\.\./|'$app_root/|g" "$dest/index.php" > "$dest/index.php.publishing"
          mv "$dest/index.php.publishing" "$dest/index.php"

          if grep -q "__DIR__\.'/\.\./" "$dest/index.php"; then
            echo "index.php still resolves the framework relative to the web root after rewriting."
            exit 1
          fi

          for required in "$app_root/vendor/autoload.php" "$app_root/bootstrap/app.php"; do
            if ! grep -qF "'$required'" "$dest/index.php"; then
              echo "$dest/index.php does not require $required after rewriting."
              exit 1
            fi
            if [ ! -f "$required" ]; then
              echo "$dest/index.php requires $required, which does not exist on this host."
              exit 1
            fi
          done

          php -l "$dest/index.php" > /dev/null || {
            echo "The rewritten $dest/index.php is not valid PHP."
            exit 1
          }

          echo "Rewrote $dest/index.php to load the framework from $app_root."

          if [ ! -f "$dest/.htaccess" ]; then
            cp "$src/.htaccess" "$dest/.htaccess"
            echo "No .htaccess in the web root; installed Laravel's front-controller rewrite."
          elif grep -qE '^[[:space:]]*RewriteRule[[:space:]]+\^\(\.\*\)\$[[:space:]]+public/' "$dest/.htaccess"; then
            echo "$dest/.htaccess still carries the document-root rewrite into public/, which"
            echo "404s every request in this layout. Replace it with Laravel's own (keep any"
            echo "hPanel PHP handler block):  cp $src/.htaccess $dest/.htaccess"
            exit 1
          elif ! grep -qE 'RewriteRule.*index\.php' "$dest/.htaccess"; then
            # Typically just an hPanel PHP handler block: append Laravel's
            # rules rather than replace, once (the grep makes reruns a no-op).
            printf '\n# BEGIN laravel-front-controller -- appended by the deploy, safe to edit\n' >> "$dest/.htaccess"
            cat "$src/.htaccess" >> "$dest/.htaccess"
            printf '# END laravel-front-controller\n' >> "$dest/.htaccess"
            echo "Appended Laravel's front-controller rules to the existing web-root .htaccess."
          fi
          REMOTE

      # A green deploy over a site answering 500 is the failure that matters,
      # so ask the live app: /up (Laravel boots), the admin shell, and the
      # public API the site reads (Laravel -> MySQL). Skipped when
      # HOSTINGER_APP_URL is not set.
      - name: Smoke test
        env:
          APP_URL: ${{ vars.HOSTINGER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set the repository variable HOSTINGER_APP_URL (e.g. https://admin.example.com) to enable this check."
            exit 0
          fi
          base=${APP_URL%/}
          failed=0
          for path in /up /admin/login; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")
            echo "GET $path -> $status"
            [ "$status" = "200" ] || failed=1
          done
          body=$(curl -s --max-time 20 "$base/api/v1/public/settings" || true)
          if printf '%s' "$body" | grep -q '"success":true'; then
            echo "GET /api/v1/public/settings -> success"
          else
            echo "GET /api/v1/public/settings did not answer success:true (database or config problem)."
            failed=1
          fi
          [ "$failed" = "0" ] || { echo "The deployed app is not healthy."; exit 1; }
